components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://oauth2.googleapis.com/token
          scopes:
            email: Access email
            profile: Access profile information
  schemas:
    SignupUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: 'MotDePasseSecure123!'
        nom:
          type: string
          example: 'Jean Dupont'
        roles:
          type: array
          items:
            type: string
            example: 'CLIENT'
      required:
        - email
        - password
        - nom
        - roles
    UserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: 'MotDePasseSecure123!'
        nom:
          type: string
          example: 'Jean Dupont'
        roles:
          type: array
          items:
            type: string
            example: 'CLIENT'
      required:
        - email
        - password
        - nom
        - roles
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: user@example.com
        nom:
          type: string
          example: 'Jean Dupont'
        roles:
          type: array
          items:
            type: string
            example: 'CLIENT'

    SigninUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: 'MotDePasseSecure123!'
      required:
        - email
        - password

    SigninGoogleRequest:
      type: object
      properties:
        idToken:
          type: string
          example: 'google_token_example'
      required:
        - idToken

    SigninFacebookRequest:
      type: object
      properties:
        accessToken:
          type: string
          example: 'facebook_token_example'
      required:
        - accessToken
    RefreshTokenRequest:
      type: object
      properties:
        accessToken:
          type: string
          example: 'accessToken_token_example'
      required:
        - accessToken
    TokenResponse:
      type: object
      properties:
        Token:
          type: string
          example: 'token_example'
        RefreshToken:
          type: string
          example: 'RefreshTokenExample'
      required:
        - Token

    ArticleRequest:
      type: object
      properties:
        titre:
          type: string
          description: Le titre de l'article
        contenu:
          type: string
          description: Le contenu de l'article
        auteur:
          type: string
          description: L'auteur de l'article
      required:
        - titre
        - contenu
        - auteur

    ArticleResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: L'ID unique de l'article
        titre:
          type: string
          description: Le titre de l'article
        contenu:
          type: string
          description: Le contenu de l'article
        auteur:
          type: string
          description: L'auteur de l'article

    CommandeRequest:
      type: object
      properties:
        utilisateurId:
          type: integer
          format: int64
          description: L'ID de l'utilisateur ayant passé la commande
        dateCommande:
          type: string
          format: date-time
          description: La date de la commande
        statut:
          type: string
          description: Le statut de la commande
      required:
        - utilisateurId
        - dateCommande
        - statut

    CommandeResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: L'ID unique de la commande
        utilisateurId:
          type: integer
          format: int64
          description: L'ID de l'utilisateur ayant passé la commande
        dateCommande:
          type: string
          format: date-time
          description: La date de la commande
        statut:
          type: string
          description: Le statut de la commande

    PaiementRequest:
      type: object
      properties:
        commandeId:
          type: integer
          format: int64
          description: L'ID de la commande associée
        montant:
          type: number
          format: float
          description: Le montant du paiement
        methode:
          type: string
          description: La méthode de paiement utilisée
      required:
        - commandeId
        - montant
        - methode

    PaiementResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: L'ID unique du paiement
        commandeId:
          type: integer
          format: int64
          description: L'ID de la commande associée
        montant:
          type: number
          format: float
          description: Le montant du paiement
        methode:
          type: string
          description: La méthode de paiement utilisée

    PanierRequest:
      type: object
      properties:
        utilisateurId:
          type: integer
          format: int64
          description: L'ID de l'utilisateur propriétaire du panier
        articles:
          type: array
          items:
            type: object
            properties:
              articleId:
                type: integer
                format: int64
                description: L'ID de l'article dans le panier
              quantite:
                type: integer
                description: La quantité de l'article dans le panier
      required:
        - utilisateurId
        - articles

    PanierResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: L'ID unique du panier
        utilisateurId:
          type: integer
          format: int64
          description: L'ID de l'utilisateur propriétaire du panier
        articles:
          type: array
          items:
            type: object
            properties:
              articleId:
                type: integer
                format: int64
                description: L'ID de l'article dans le panier
              quantite:
                type: integer
                description: La quantité de l'article dans le panier
      required:
        - id
        - utilisateurId
        - articles
    ProductRequest:
      type: object
      properties:
        nom:
          type: string
          description: Nom du produit
        description:
          type: string
          description: Description du produit
        prix:
          type: number
          format: double
          description: Prix du produit
        stock:
          type: integer
          format: int64
          description: Quantité du produit
        categorie:
          type: integer
          format: int64
          description: Catégorie du produit
        promotions:
          type: array
          items:
            type: object
            description: Promotion appliquée au produit
            properties:
              promotionId:
                type: integer
                format: int64
                description: L'ID de la promotion liée au produit
      required:
        - nom
        - prix
        - stock
#        - categorie
    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: L'ID unique du produit
        nom:
          type: string
          description: Nom du produit
        description:
          type: string
          description: Description du produit
        prix:
          type: number
          format: double
          description: Prix du produit
        stock:
          type: integer
          description: Quantité du produit en stock
        categorie:
          type: object
          description: Détails de la catégorie du produit
          properties:
            id:
              type: integer
              format: int64
              description: L'ID de la catégorie
            nom:
              type: string
              description: Nom de la catégorie
            description:
              type: string
              description: Description du produit
        promotions:
          type: array
          description: Liste des promotions appliquées au produit
          items:
            type: object
            properties:
              promotionId:
                type: integer
                format: int64
                description: L'ID de la promotion
              nomPromotion:
                type: string
                description: Nom de la promotion
              reduction:
                type: number
                format: double
                description: Pourcentage ou montant de la réduction
              dateDebut:
                type: string
                format: date-time
                description: Date début du promotion
              dateFin:
                type: string
                format: date-time
                description: Date fin du promotion
      required:
        - id
        - nom
        - description
        - prix
        - stock
        - categorie
        - dateCreation
    CategorieRequest:
      type: object
      properties:
        nom:
          type: string
          description: Nom du categorie
        description:
          type: string
          description: Description du produit
      required:
        - nom
    CategorieResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: L'ID unique du categorie
        nom:
          type: string
          description: Nom du categorie
        description:
          type: string
          description: Description du categorie
      required:
        - nom
        - description
    Response:
      type: object
      properties:
        code:
          type: string
          description: Le code d'erreur
          example: "INVALID_REQUEST"
        message:
          type: string
          description: Un message d'erreur détaillé
          example: "La requête est invalide."
        details:
          type: array
          items:
            type: string
          description: Détails supplémentaires sur l'erreur
          example: [ "Le champ 'email' est requis." ]
