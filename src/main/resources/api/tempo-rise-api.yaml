          description: Erreur serveur interne
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
  /v1/categories:
    get:
      summary: Récupérer toutes les catégories
      operationId: getAllCategories
      tags:
        - Categories
      responses:
        '200':
          description: Liste des catégories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategorieResponse'

    post:
      summary: Créer une nouvelle catégorie
      operationId: createCategory
      tags:
        - Categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategorieRequest'
      responses:
        '201':
          description: Catégorie créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorieResponse'

    delete:
      summary: Supprimer toutes les catégories
      operationId: deleteAllCategories
      tags:
        - Categories
      responses:
        '204':
          description: Toutes les catégories ont été supprimées avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /v1/categories/{id}:
    get:
      summary: Récupérer une catégorie par ID
      operationId: getCategoryById
