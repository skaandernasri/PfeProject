<div class="container mx-auto px-4">
  <div class="flex justify-between items-center mb-8">
    <h1 class="text-3xl font-bold">Orders Management</h1>
    <div class="flex gap-4">
      <select class="bg-[var(--background)] border rounded px-4 py-2">
        <option value="">Filter by Status</option>
        <option value="pending">Pending</option>
        <option value="processing">Processing</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
      </select>
      <button class="bg-[var(--primary)] text-white px-4 py-2 rounded hover:opacity-90">
        Export Orders
      </button>
    </div>
  </div>

  <!-- Orders Table -->
  <div class="bg-[var(--surface)] rounded-lg shadow-md overflow-hidden">
    <table class="w-full">
      <thead class="bg-[var(--background)]">
        <tr>
          <th class="px-6 py-3 text-left">Order ID</th>
          <th class="px-6 py-3 text-left">Customer</th>
          <th class="px-6 py-3 text-left">Products</th>
          <th class="px-6 py-3 text-left">Total</th>
          <th class="px-6 py-3 text-left">Status</th>
          <th class="px-6 py-3 text-left">Date</th>
          <th class="px-6 py-3 text-left">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr class="border-t border-gray-200">
          <td class="px-6 py-4">#12345</td>
          <td class="px-6 py-4">John Doe</td>
          <td class="px-6 py-4">2 items</td>
          <td class="px-6 py-4">$99.99</td>
          <td class="px-6 py-4">
            <span class="px-2 py-1 bg-yellow-100 text-yellow-800 rounded-full text-sm">Processing</span>
          </td>
          <td class="px-6 py-4">2024-01-15</td>
          <td class="px-6 py-4">
            <button class="text-blue-600 hover:text-blue-800 mr-3">View</button>
            <button class="text-red-600 hover:text-red-800">Cancel</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="mt-6 flex justify-between items-center">
    <p class="text-sm text-[var(--text)]">Showing 1 to 10 of 50 orders</p>
    <div class="flex gap-2">
      <button class="px-3 py-1 border rounded hover:bg-[var(--background)]">Previous</button>
      <button class="px-3 py-1 border rounded bg-[var(--primary)] text-white">1</button>
      <button class="px-3 py-1 border rounded hover:bg-[var(--background)]">2</button>
      <button class="px-3 py-1 border rounded hover:bg-[var(--background)]">3</button>
      <button class="px-3 py-1 border rounded hover:bg-[var(--background)]">Next</button>
    </div>
  </div>
</div>
