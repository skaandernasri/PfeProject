<div class="container mx-auto px-4">
  <div class="flex justify-between items-center mb-8">
    <h1 class="text-3xl font-bold">Users Management</h1>
    <button class="bg-[var(--primary)] text-white px-4 py-2 rounded hover:opacity-90">
      Add New User
    </button>
  </div>

  <!-- Users Table -->
  <div class="bg-[var(--surface)] rounded-lg shadow-md overflow-hidden">
    <table class="w-full">
      <thead class="bg-[var(--background)]">
        <tr>
          <th class="px-6 py-3 text-left">ID</th>
          <th class="px-6 py-3 text-left">Name</th>
          <th class="px-6 py-3 text-left">Email</th>
          <th class="px-6 py-3 text-left">Role</th>
          <th class="px-6 py-3 text-left">Status</th>
          <th class="px-6 py-3 text-left">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr class="border-t border-gray-200">
          <td class="px-6 py-4">#001</td>
          <td class="px-6 py-4">John Doe</td>
          <td class="px-6 py-4"></td>
          <td class="px-6 py-4">Customer</td>
          <td class="px-6 py-4">
            <span class="px-2 py-1 bg-green-100 text-green-800 rounded-full text-sm">Active</span>
          </td>
          <td class="px-6 py-4">
            <button class="text-blue-600 hover:text-blue-800 mr-3">Edit</button>
            <button class="text-red-600 hover:text-red-800">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="mt-6 flex justify-between items-center">
    <p class="text-sm text-[var(--text)]">Showing 1 to 10 of 100 entries</p>
    <div class="flex gap-2">
      <button class="px-3 py-1 border rounded hover:bg-[var(--background)]">Previous</button>
      <button class="px-3 py-1 border rounded bg-[var(--primary)] text-white">1</button>
      <button class="px-3 py-1 border rounded hover:bg-[var(--background)]">2</button>
      <button class="px-3 py-1 border rounded hover:bg-[var(--background)]">3</button>
      <button class="px-3 py-1 border rounded hover:bg-[var(--background)]">Next</button>
    </div>
  </div>
</div>
