<div class="container mx-auto px-4">
  <h1 class="text-3xl font-bold mb-8">Admin Dashboard</h1>
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
    <!-- Stats Cards -->
    <div class="bg-[var(--surface)] p-6 rounded-lg shadow-md">
      <h3 class="text-lg font-semibold mb-2">Total Orders</h3>
      <p class="text-3xl font-bold text-[var(--primary)]">1,234</p>
      <p class="text-sm text-[var(--text)] mt-2">+12% from last month</p>
    </div>
    <div class="bg-[var(--surface)] p-6 rounded-lg shadow-md">
      <h3 class="text-lg font-semibold mb-2">Total Revenue</h3>
      <p class="text-3xl font-bold text-[var(--primary)]">$45,678</p>
      <p class="text-sm text-[var(--text)] mt-2">+8% from last month</p>
    </div>
    <div class="bg-[var(--surface)] p-6 rounded-lg shadow-md">
      <h3 class="text-lg font-semibold mb-2">Active Users</h3>
      <p class="text-3xl font-bold text-[var(--primary)]">892</p>
      <p class="text-sm text-[var(--text)] mt-2">+15% from last month</p>
    </div>
    <div class="bg-[var(--surface)] p-6 rounded-lg shadow-md">
      <h3 class="text-lg font-semibold mb-2">Products</h3>
      <p class="text-3xl font-bold text-[var(--primary)]">156</p>
      <p class="text-sm text-[var(--text)] mt-2">+5 new this month</p>
    </div>
  </div>

  <!-- Recent Orders -->
  <div class="mt-8">
    <h2 class="text-2xl font-semibold mb-6">Recent Orders</h2>
    <div class="bg-[var(--surface)] rounded-lg shadow-md overflow-hidden">
      <table class="w-full">
        <thead class="bg-[var(--background)]">
          <tr>
            <th class="px-6 py-3 text-left">Order ID</th>
            <th class="px-6 py-3 text-left">Customer</th>
            <th class="px-6 py-3 text-left">Status</th>
            <th class="px-6 py-3 text-left">Amount</th>
            <th class="px-6 py-3 text-left">Date</th>
          </tr>
        </thead>
        <tbody>
          <tr class="border-t border-gray-200">
            <td class="px-6 py-4">#12345</td>
            <td class="px-6 py-4">John Doe</td>
            <td class="px-6 py-4">
              <span class="px-2 py-1 bg-green-100 text-green-800 rounded-full text-sm">Completed</span>
            </td>
            <td class="px-6 py-4">$99.99</td>
            <td class="px-6 py-4">2024-01-15</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
