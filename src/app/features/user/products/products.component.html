<div class="container mx-auto px-4">
  <h1 class="text-3xl font-bold mb-8">Our Products</h1>
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    <!-- Product Card Template -->
    <div class="bg-[var(--surface)] rounded-lg shadow-md overflow-hidden">
      <img src="https://via.placeholder.com/300" alt="Product" class="w-full h-48 object-cover">
      <div class="p-4">
        <h3 class="text-lg font-semibold mb-2">Product Name</h3>
        <p class="text-[var(--text)] mb-4">Product description goes here.</p>
        <div class="flex justify-between items-center">
          <span class="text-lg font-bold">$99.99</span>
          <button class="bg-[var(--primary)] text-white px-4 py-2 rounded hover:opacity-90">
            Add to Cart
          </button>
        </div>
      </div>
    </div>
    <!-- Repeat for more products -->
  </div>
</div>
