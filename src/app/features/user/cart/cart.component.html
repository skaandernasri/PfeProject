<div class="container mx-auto px-4">
  <h1 class="text-3xl font-bold mb-8">Shopping Cart</h1>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <div class="lg:col-span-2">
      <!-- Cart Items -->
      <div class="bg-[var(--surface)] rounded-lg shadow-md p-6 mb-4">
        <div class="flex items-center justify-between border-b border-gray-200 pb-4 mb-4">
          <div class="flex items-center">
            <img src="https://via.placeholder.com/100" alt="Product" class="w-16 h-16 object-cover rounded">
            <div class="ml-4">
              <h3 class="text-lg font-semibold">Product Name</h3>
              <p class="text-[var(--text)]">$99.99</p>
            </div>
          </div>
          <div class="flex items-center">
            <button class="px-2 py-1 border rounded">-</button>
            <span class="mx-4">1</span>
            <button class="px-2 py-1 border rounded">+</button>
          </div>
        </div>
      </div>
    </div>
    <!-- Cart Summary -->
    <div class="bg-[var(--surface)] rounded-lg shadow-md p-6 h-fit">
      <h2 class="text-xl font-semibold mb-4">Order Summary</h2>
      <div class="flex justify-between mb-4">
        <span>Subtotal</span>
        <span>$99.99</span>
      </div>
      <div class="flex justify-between mb-4">
        <span>Shipping</span>
        <span>$9.99</span>
      </div>
      <div class="flex justify-between font-bold">
        <span>Total</span>
        <span>$109.98</span>
      </div>
      <a routerLink="/checkout" class="block w-full bg-[var(--primary)] text-white text-center py-2 rounded mt-6 hover:opacity-90">
        Proceed to Checkout
      </a>
    </div>
  </div>
</div>
