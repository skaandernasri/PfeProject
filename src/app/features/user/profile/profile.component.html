<div class="container mx-auto px-4">
  <h1 class="text-3xl font-bold mb-8">My Profile</h1>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- Profile Information -->
    <div class="lg:col-span-2">
      <div class="bg-[var(--surface)] rounded-lg shadow-md p-6">
        <h2 class="text-xl font-semibold mb-6">Personal Information</h2>
        <form class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-2">First Name</label>
              <input type="text" class="w-full p-2 border rounded bg-[var(--background)]">
            </div>
            <div>
              <label class="block text-sm font-medium mb-2">Last Name</label>
              <input type="text" class="w-full p-2 border rounded bg-[var(--background)]">
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium mb-2">Email</label>
            <input type="email" class="w-full p-2 border rounded bg-[var(--background)]">
          </div>
          <div>
            <label class="block text-sm font-medium mb-2">Phone Number</label>
            <input type="tel" class="w-full p-2 border rounded bg-[var(--background)]">
          </div>
          <button class="bg-[var(--primary)] text-white px-6 py-2 rounded hover:opacity-90">
            Save Changes
          </button>
        </form>
      </div>
    </div>
    <!-- Order History -->
    <div class="bg-[var(--surface)] rounded-lg shadow-md p-6">
      <h2 class="text-xl font-semibold mb-6">Order History</h2>
      <div class="space-y-4">
        <div class="border-b border-gray-200 pb-4">
          <div class="flex justify-between mb-2">
            <span class="font-medium">Order #12345</span>
            <span class="text-[var(--text)]">$199.98</span>
          </div>
          <p class="text-sm text-[var(--text)]">Placed on: Jan 15, 2024</p>
          <p class="text-sm text-[var(--text)]">Status: Delivered</p>
        </div>
        <div class="border-b border-gray-200 pb-4">
          <div class="flex justify-between mb-2">
            <span class="font-medium">Order #12344</span>
            <span class="text-[var(--text)]">$99.99</span>
          </div>
          <p class="text-sm text-[var(--text)]">Placed on: Jan 10, 2024</p>
          <p class="text-sm text-[var(--text)]">Status: Shipped</p>
        </div>
      </div>
    </div>
  </div>
</div>
