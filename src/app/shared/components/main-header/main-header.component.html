<header class="bg-[var(--surface)] shadow-md">
  <div class="container mx-auto px-4">
    <div class="flex justify-between items-center h-16">
      <!-- Logo -->
      <div class="flex items-center">
        <a routerLink="/" class="flex items-center space-x-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-[var(--primary)]" viewBox="0 0 20 20" fill="currentColor">
            <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/>
          </svg>
          <span class="text-xl font-bold">E-Store</span>
        </a>
      </div>

      <!-- Desktop Navigation -->
      <nav class="hidden md:flex items-center space-x-6">
        <a routerLink="/" routerLinkActive="text-[var(--primary)]" [routerLinkActiveOptions]="{exact: true}" 
           class="text-[var(--text)] hover:text-[var(--primary)] transition-colors">
          Accueil
        </a>
        <a routerLink="/products" routerLinkActive="text-[var(--primary)]" 
           class="text-[var(--text)] hover:text-[var(--primary)] transition-colors">
          Produits
        </a>
        <a routerLink="/blog" routerLinkActive="text-[var(--primary)]" 
           class="text-[var(--text)] hover:text-[var(--primary)] transition-colors">
          Blog
        </a>
        <a routerLink="/contact" routerLinkActive="text-[var(--primary)]" 
           class="text-[var(--text)] hover:text-[var(--primary)] transition-colors">
          Contact
        </a>
      </nav>

      <!-- Search Bar -->
      <div class="hidden md:flex items-center flex-1 max-w-lg mx-6">
        <div class="relative w-full">
          <input type="text" placeholder="Rechercher..." 
                 class="w-full px-4 py-2 rounded-lg bg-[var(--background)] border border-gray-300 focus:outline-none focus:border-[var(--primary)]">
          <button class="absolute right-3 top-2.5">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Right Side Actions -->
      <div class="flex items-center space-x-4">
        <!-- Cart Button -->
        <a routerLink="/cart" class="relative flex items-center text-[var(--text)] hover:text-[var(--primary)] transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
          <span *ngIf="cartItemCount > 0" 
                class="absolute -top-2 -right-2 bg-[var(--primary)] text-white text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full">
            {{ cartItemCount }}
          </span>
        </a>

        <!-- Dashboard Buttons -->
        <a routerLink="/admin/dashboard" 
           class="hidden md:flex items-center space-x-1 px-3 py-2 rounded-md bg-red-500 text-white hover:bg-red-600 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
          </svg>
          <span>Admin</span>
        </a>

        <!-- User Menu -->
        <div class="relative">
          <button (click)="toggleUserMenu()" class="flex items-center space-x-1 text-[var(--text)] hover:text-[var(--primary)]">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            <span class="hidden md:inline">Compte</span>
          </button>
          <div *ngIf="isUserMenuOpen" class="absolute right-0 mt-2 w-48 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5">
            <div class="py-1">
              <a routerLink="/profile" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Mon Profil</a>
              <a routerLink="/orders" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Mes Commandes</a>
              <button class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                Déconnexion
              </button>
            </div>
          </div>
        </div>

        <!-- Mobile Menu Button -->
        <button (click)="toggleMobileMenu()" class="md:hidden">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path *ngIf="!isMobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            <path *ngIf="isMobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Menu -->
    <div *ngIf="isMobileMenuOpen" class="md:hidden">
      <div class="px-2 pt-2 pb-3 space-y-1">
        <a routerLink="/" class="block px-3 py-2 rounded-md text-base font-medium hover:bg-[var(--background)]">
          Accueil
        </a>
        <a routerLink="/products" class="block px-3 py-2 rounded-md text-base font-medium hover:bg-[var(--background)]">
          Produits
        </a>
        <a routerLink="/blog" class="block px-3 py-2 rounded-md text-base font-medium hover:bg-[var(--background)]">
          Blog
        </a>
        <a routerLink="/contact" class="block px-3 py-2 rounded-md text-base font-medium hover:bg-[var(--background)]">
          Contact
        </a>
        <a routerLink="/cart" class="block px-3 py-2 rounded-md text-base font-medium hover:bg-[var(--background)]">
          Panier ({{ cartItemCount }})
        </a>
        <div class="pt-4 pb-3 border-t border-gray-200">
          <a routerLink="/admin/dashboard" class="mt-2 block px-3 py-2 rounded-md text-base font-medium text-white bg-red-500 hover:bg-red-600">
            Dashboard Admin
          </a>
        </div>
      </div>
    </div>
  </div>
</header>
